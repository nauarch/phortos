# Releases a tagged version (v1.2.3): the phortos and phortosctl binaries for linux/amd64 and
# linux/arm64 with their checksums, LICENSE and NOTICE on a GitHub release, all stamped with the
# tag. A tag with a suffix (v1.2.3-rc.1) is a pre-release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        env:
          PHORTOS_VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          go generate ./internal/frontdoor/setup/dist
          mkdir -p out
          cp internal/frontdoor/setup/dist/bin/phortosctl-* LICENSE NOTICE out/
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=$PHORTOS_VERSION" -o out/phortos-linux-$arch ./cmd/phortos
          done
          (cd out && sha256sum -- * > SHA256SUMS)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          flags=(--title "$TAG" --generate-notes)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" out/* "${flags[@]}"
