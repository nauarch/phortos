# Keeps what phortos builds with current: the GitHub Actions its workflows use, and its one Go
# module dependency (go.yaml.in/yaml/v3, which reads the config file).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [ci]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [build]
